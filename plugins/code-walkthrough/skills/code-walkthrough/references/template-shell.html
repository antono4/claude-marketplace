<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!-- @SLOT:title --></title>
<style>
:root {
  --bg: #f7f6f9; --panel: #ffffff; --ink: #1d1627; --ink-2: #584d6b; --ink-3: #8a7f9c;
  --accent: #6c5fc7; --accent-soft: #efedfb; --accent-ink: #4a3fa3;
  --line: #e4e0ee; --code-bg: #f4f2fa; --code-ink: #2b2440;
  --add-bg: #dcf5e3; --add-bar: #1f9d55; --del-bg: #fde4e4; --del-bar: #d64545;
  --note-bg: #eef4ff; --note-bar: #3b82c4; --warn-bg: #fdf3e0; --warn-bar: #d9930d;
  --key-bg: #f0ebfd; --key-bar: #6c5fc7;
  --str: #0b7a4b; --cmt: #8a7f9c; --kw: #4a3fa3;
  --shadow: 0 1px 3px rgba(29,22,39,.08), 0 4px 14px rgba(29,22,39,.05);
}
[data-theme="dark"] {
  --bg: #16121f; --panel: #1e1830; --ink: #ece8f5; --ink-2: #b6aecb; --ink-3: #7d7396;
  --accent: #9d8fef; --accent-soft: #2a2244; --accent-ink: #b6a8ff;
  --line: #322a4d; --code-bg: #241d3a; --code-ink: #e2dcf2;
  --add-bg: #143a24; --add-bar: #34c774; --del-bg: #441f24; --del-bar: #ef6a6a;
  --note-bg: #16283f; --note-bar: #58a6e8; --warn-bg: #3a2c12; --warn-bar: #e8b04b;
  --key-bg: #2a2244; --key-bar: #9d8fef;
  --str: #6fd3a0; --cmt: #7d7396; --kw: #b6a8ff;
  --shadow: 0 1px 3px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.25);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.62 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
/* ---------- layout ---------- */
#sidebar {
  position: fixed; top: 0; left: 0; bottom: 0; width: 292px; overflow-y: auto;
  background: var(--panel); border-right: 1px solid var(--line); padding: 22px 18px 60px;
}
#sidebar h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); margin: 18px 0 8px; }
#sidebar a { display: block; color: var(--ink-2); text-decoration: none; font-size: 13.5px; padding: 4px 10px; border-radius: 7px; border-left: 3px solid transparent; }
#sidebar a:hover { background: var(--accent-soft); color: var(--accent-ink); }
#sidebar a.active { color: var(--accent-ink); border-left-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
#sidebar .brand { font-size: 15px; font-weight: 700; color: var(--ink); margin-bottom: 2px; }
#sidebar .sub { font-size: 12px; color: var(--ink-3); margin-bottom: 14px; }
main { margin-left: 292px; padding: 40px 48px 140px; max-width: 1240px; }
@media (max-width: 1060px) { #sidebar { display: none; } main { margin-left: 0; padding: 24px 18px 120px; } }
section.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 30px 34px; margin: 0 0 34px; box-shadow: var(--shadow); scroll-margin-top: 24px;
}
section.card > h2 { margin-top: 0; font-size: 24px; letter-spacing: -.01em; }
h3 { font-size: 18px; margin: 30px 0 10px; }
h3[id], h2[id] { scroll-margin-top: 20px; }
h4 { font-size: 15.5px; margin: 22px 0 8px; }
p { margin: 10px 0; }
a { color: var(--accent-ink); }
code { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: .88em; background: var(--code-bg); padding: .12em .38em; border-radius: 5px; }
/* ---------- hero ---------- */
#hero { background: linear-gradient(135deg, #241d3a, #4a3fa3 55%, #6c5fc7); color: #fff; border: none; }
#hero h1 { font-size: 30px; margin: 0 0 6px; letter-spacing: -.02em; }
#hero p.sub { color: #d8d2f2; font-size: 16px; margin: 0 0 18px; }
#hero .meta { display: flex; flex-wrap: wrap; gap: 8px; }
#hero .meta span { background: rgba(255,255,255,.13); border: 1px solid rgba(255,255,255,.22); border-radius: 999px; padding: 4px 12px; font-size: 12.5px; font-family: ui-monospace, Menlo, monospace; }
/* ---------- pills, stat bars ---------- */
.pill { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; vertical-align: middle; }
.pill.file { background: var(--accent-soft); color: var(--accent-ink); font-family: ui-monospace, Menlo, monospace; font-weight: 500; }
.pill.new { background: var(--add-bg); color: var(--add-bar); }
.pill.changed { background: var(--warn-bg); color: var(--warn-bar); }
.statbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin: 8px 0 4px; max-width: 420px; }
.statbar .a { background: var(--add-bar); } .statbar .d { background: var(--del-bar); }
.statlbl { font-size: 12.5px; color: var(--ink-3); font-family: ui-monospace, Menlo, monospace; }
/* ---------- callouts ---------- */
.callout { border-radius: 10px; padding: 14px 18px 14px 16px; margin: 16px 0; border-left: 4px solid; font-size: 14.5px; }
.callout p:first-child { margin-top: 0; } .callout p:last-child { margin-bottom: 0; }
.callout .t { font-weight: 700; display: block; margin-bottom: 3px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
.note { background: var(--note-bg); border-color: var(--note-bar); } .note .t { color: var(--note-bar); }
.warn { background: var(--warn-bg); border-color: var(--warn-bar); } .warn .t { color: var(--warn-bar); }
.key  { background: var(--key-bg);  border-color: var(--key-bar); }  .key .t { color: var(--key-bar); }
/* ---------- code ---------- */
.codewrap { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 14px 0; background: var(--code-bg); }
.codewrap .codehead { display: flex; justify-content: space-between; align-items: center; background: var(--accent-soft); padding: 6px 14px; font-size: 12.5px; font-family: ui-monospace, Menlo, monospace; color: var(--accent-ink); }
.codewrap pre { margin: 0; padding: 14px 0; overflow-x: auto; font-size: 13px; line-height: 1.55; }
.codewrap pre code { background: none; padding: 0; font-size: inherit; color: var(--code-ink); display: block; }
.cl { display: block; padding: 0 16px 0 14px; border-left: 3px solid transparent; white-space: pre; }
.cl.add { background: var(--add-bg); border-left-color: var(--add-bar); }
.cl.del { background: var(--del-bg); border-left-color: var(--del-bar); }
.cl.hl  { background: var(--accent-soft); border-left-color: var(--accent); }
.cl.dim { opacity: .62; }
.cmt { color: var(--cmt); font-style: italic; } .str { color: var(--str); } .kw { color: var(--kw); font-weight: 600; }
/* ---------- before/after tabs ---------- */
.batabs { display: inline-flex; background: var(--accent-soft); border-radius: 9px; padding: 3px; gap: 3px; margin: 6px 0; }
.batabs button { border: none; background: transparent; color: var(--accent-ink); font: 600 12.5px/1 inherit; padding: 7px 16px; border-radius: 7px; cursor: pointer; }
.batabs button.on { background: var(--panel); box-shadow: var(--shadow); }
.bapane { display: none; } .bapane.on { display: block; }
/* ---------- details ---------- */
details { border: 1px solid var(--line); border-radius: 10px; margin: 12px 0; background: var(--panel); }
details > summary { cursor: pointer; padding: 10px 16px; font-weight: 600; font-size: 14px; color: var(--accent-ink); list-style: none; }
details > summary::before { content: "▸ "; }
details[open] > summary::before { content: "▾ "; }
details > .body { padding: 2px 18px 14px; border-top: 1px dashed var(--line); }
/* ---------- tables ---------- */
table.tbl { border-collapse: collapse; width: 100%; font-size: 13.5px; margin: 14px 0; }
.tbl th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); padding: 7px 10px; border-bottom: 2px solid var(--line); }
.tbl td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:nth-child(even) td { background: color-mix(in srgb, var(--accent-soft) 40%, transparent); }
.tbl td code { font-size: 12px; }
/* ---------- mermaid: light canvas in BOTH themes (dark text unreadable on dark) ---------- */
.mermaid { background: #fbfafc; border: 1px solid var(--line); border-radius: 10px; padding: 18px 10px; margin: 14px 0; text-align: center; overflow-x: auto; }
.mermaid-fallback { font-size: 12.5px; color: var(--ink-3); text-align: left; }
/* ---------- walker ---------- */
.walker { display: grid; grid-template-columns: minmax(0,7fr) minmax(0,5fr); gap: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin: 16px 0; }
@media (max-width: 900px) { .walker { grid-template-columns: 1fr; } }
.walker .wcode { background: var(--code-bg); border-right: 1px solid var(--line); overflow-x: auto; }
.walker .wcode pre { margin: 0; padding: 12px 0; font-size: 12.5px; line-height: 1.5; overflow-x: auto; }
.walker .wside { background: var(--panel); padding: 16px 20px; display: flex; flex-direction: column; }
.walker .wstep { display: none; } .walker .wstep.on { display: block; }
.walker .wstep h4 { margin-top: 0; }
.walker .wctl { margin-top: auto; padding-top: 14px; display: flex; align-items: center; gap: 10px; }
.walker .wctl button { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 8px; padding: 7px 15px; font: 600 13px inherit; cursor: pointer; }
.walker .wctl button.sec { background: transparent; color: var(--accent-ink); }
.walker .wctl button:disabled { opacity: .35; cursor: default; }
.walker .wdots { display: flex; gap: 5px; }
.walker .wdots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.walker .wdots i.on { background: var(--accent); }
/* ---------- glossary ---------- */
dfn { font-style: normal; border-bottom: 1.5px dotted var(--accent); cursor: help; }
.glos dt { font-weight: 700; font-family: ui-monospace, Menlo, monospace; font-size: 13.5px; margin-top: 12px; }
.glos dd { margin: 2px 0 0 0; font-size: 14px; color: var(--ink-2); }
/* ---------- misc ---------- */
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; margin: 10px 0; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; border-left: 3px solid; }
.legend .l-add { background: var(--add-bg); border-left-color: var(--add-bar); }
.legend .l-del { background: var(--del-bg); border-left-color: var(--del-bar); }
.legend .l-hl  { background: var(--accent-soft); border-left-color: var(--accent); }
.big { font-size: 17.5px; }
.kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 6px; font-size: 12px; background: var(--panel); }
#themeBtn { position: fixed; top: 14px; right: 16px; z-index: 50; border: 1px solid var(--line); background: var(--panel); color: var(--ink-2); border-radius: 999px; padding: 7px 14px; font: 600 12.5px inherit; cursor: pointer; box-shadow: var(--shadow); }
.sig { font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: var(--code-bg); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 10px 14px; overflow-x: auto; white-space: pre; margin: 8px 0; }
</style>
</head>
<body>
<button id="themeBtn" title="Toggle light/dark">◐ theme</button>
<nav id="sidebar">
  <div class="brand"><!-- @SLOT:brand --></div>
  <div class="sub"><!-- @SLOT:brand-sub --></div>
  <!-- @SLOT:sidebar — groups like:
  <h2>Section group</h2>
  <a href="#anchor-id">Section title</a>
  Every href must match an id on a section.card or h3 in <main>. -->
</nav>
<main>
<!-- @SLOT:sections — author each section as:

<section class="card" id="anchor-id">
  <h2>Section title</h2>
  ...content...
</section>

COMPONENT PATTERNS (all wired by the JS below):

1) Hero:
<section class="card" id="hero">
  <h1>Title</h1><p class="sub">Subtitle</p>
  <div class="meta"><span>chip</span><span>chip</span></div>
</section>

2) Before/after toggle (group name must prefix every button/pane key):
<div class="batabs" data-tabs="grp">
  <button class="on" data-p="grp-a">Before (base &lt;sha&gt;)</button>
  <button data-p="grp-b">After (tip &lt;sha&gt;)</button>
</div>
<div class="bapane on" data-pane="grp-a">...before code...</div>
<div class="bapane" data-pane="grp-b">...after code...</div>

3) Code with diff colors (escape &lt; as &amp;lt;):
<div class="codewrap"><div class="codehead"><span>path/to/file.py</span><span>tip &lt;sha&gt;</span></div>
<pre><code><span class="cl">context line</span>
<span class="cl add">added line (real diff only)</span>
<span class="cl del">removed line (real diff only)</span>
<span class="cl hl">emphasized line (NOT a diff)</span></code></pre></div>
Inline emphasis spans: <span class="kw">keyword</span> <span class="str">string</span> <span class="cmt">comment</span>

4) Callouts:
<div class="callout key"><span class="t">Title</span><p>...</p></div>   (.key | .note | .warn)

5) Step-through walker (steps own line ranges via data-lines; lines carry data-l):
<div class="walker" data-walker>
  <div class="wcode"><pre><code>
<span class="cl" data-l="1">line one</span>
<span class="cl" data-l="2">line two</span></code></pre></div>
  <div class="wside">
    <div class="wstep on" data-lines="1"><h4>1 · First thing</h4><p>...</p></div>
    <div class="wstep" data-lines="2"><h4>2 · Second thing</h4><p>...</p></div>
    <div class="wctl">
      <button class="sec" data-wprev>← prev</button><div class="wdots"></div><button data-wnext>next →</button>
    </div>
  </div>
</div>

6) Mermaid (renders via CDN; degrades to readable source offline):
<div class="mermaid">
flowchart LR
    A["start"] --> B["end"]
</div>

7) Glossary terms: <dfn title="short definition">term</dfn> (click jumps to .glos)
<dl class="glos"><dt>term</dt><dd>definition</dd></dl>

8) Collapsible deep-dive:
<details><summary>Title</summary><div class="body">...</div></details>
-->
</main>
<script>
(function () {
  "use strict";
  /* ---------- theme ---------- */
  var root = document.documentElement;
  var saved = null;
  try { saved = localStorage.getItem("walkthrough-theme"); } catch (e) {}
  if (!saved && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) saved = "dark";
  if (saved) root.setAttribute("data-theme", saved);
  document.getElementById("themeBtn").addEventListener("click", function () {
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("walkthrough-theme", next); } catch (e) {}
  });
  /* ---------- before/after tabs ---------- */
  document.querySelectorAll(".batabs").forEach(function (tabs) {
    tabs.addEventListener("click", function (ev) {
      var btn = ev.target.closest("button[data-p]");
      if (!btn) return;
      var key = btn.getAttribute("data-p");
      tabs.querySelectorAll("button").forEach(function (b) { b.classList.toggle("on", b === btn); });
      var scope = tabs.parentElement;
      scope.querySelectorAll('.bapane[data-pane]').forEach(function (pane) {
        if (pane.getAttribute("data-pane").startsWith(key.slice(0, key.lastIndexOf("-")))) {
          pane.classList.toggle("on", pane.getAttribute("data-pane") === key);
        }
      });
    });
  });
  /* ---------- scrollspy ---------- */
  var links = Array.prototype.slice.call(document.querySelectorAll("#sidebar a[href^='#']"));
  var byId = {};
  links.forEach(function (a) { byId[a.getAttribute("href").slice(1)] = a; });
  var targets = links.map(function (a) { return document.getElementById(a.getAttribute("href").slice(1)); }).filter(Boolean);
  if ("IntersectionObserver" in window) {
    var spy = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) {
          links.forEach(function (a) { a.classList.remove("active"); });
          var a = byId[en.target.id];
          if (a) a.classList.add("active");
        }
      });
    }, { rootMargin: "-10% 0px -80% 0px" });
    targets.forEach(function (t) { spy.observe(t); });
  }
  /* ---------- step walkers ---------- */
  document.querySelectorAll("[data-walker]").forEach(function (walker) {
    var steps = Array.prototype.slice.call(walker.querySelectorAll(".wstep"));
    var lines = Array.prototype.slice.call(walker.querySelectorAll(".cl[data-l]"));
    var prev = walker.querySelector("[data-wprev]");
    var next = walker.querySelector("[data-wnext]");
    var dotsBox = walker.querySelector(".wdots");
    var idx = 0;
    steps.forEach(function (_, i) {
      var d = document.createElement("i");
      if (i === 0) d.classList.add("on");
      dotsBox.appendChild(d);
    });
    var dots = Array.prototype.slice.call(dotsBox.children);
    function show(n) {
      idx = Math.max(0, Math.min(steps.length - 1, n));
      steps.forEach(function (s, i) { s.classList.toggle("on", i === idx); });
      dots.forEach(function (d, i) { d.classList.toggle("on", i === idx); });
      var want = {};
      (steps[idx].getAttribute("data-lines") || "").split(",").forEach(function (x) { if (x) want[x.trim()] = true; });
      lines.forEach(function (cl) { cl.classList.toggle("hl", !!want[cl.getAttribute("data-l")]); });
      prev.disabled = idx === 0;
      next.disabled = idx === steps.length - 1;
    }
    prev.addEventListener("click", function () { show(idx - 1); });
    next.addEventListener("click", function () { show(idx + 1); });
    show(0);
  });
  /* ---------- glossary jump on dfn click ---------- */
  var dts = Array.prototype.slice.call(document.querySelectorAll(".glos dt"));
  document.querySelectorAll("dfn").forEach(function (d) {
    d.addEventListener("click", function () {
      var term = d.textContent.trim().toLowerCase();
      var hit = dts.filter(function (dt) {
        var t = dt.textContent.trim().toLowerCase();
        return t === term || t.indexOf(term) === 0 || term.indexOf(t) === 0;
      })[0];
      var el = hit || document.querySelector(".glos");
      if (el) {
        el.scrollIntoView({ behavior: "smooth", block: "center" });
        if (hit) {
          hit.style.transition = "background .3s";
          hit.style.background = "var(--warn-bg)";
          setTimeout(function () { hit.style.background = "transparent"; }, 1400);
        }
      }
    });
  });
})();
</script>
<script type="module">
  var fallback = function () {
    document.querySelectorAll(".mermaid").forEach(function (el) {
      var pre = document.createElement("pre");
      pre.className = "mermaid-fallback";
      pre.textContent = el.textContent;
      el.replaceWith(pre);
    });
  };
  try {
    var mermaid = (await import("https://cdn.jsdelivr.net/npm/mermaid@10.9.3/dist/mermaid.esm.min.mjs")).default;
    mermaid.initialize({
      startOnLoad: false,
      theme: "neutral",
      flowchart: { htmlLabels: true, curve: "basis" },
      sequence: { actorMargin: 60, messageMargin: 34 },
      er: { layoutDirection: "LR" }
    });
    // The dynamic import resolves after the load event, so startOnLoad would
    // never fire — render explicitly instead.
    await mermaid.run({ querySelector: ".mermaid", suppressErrors: true });
  } catch (e) {
    fallback();
  }
</script>
</body>
</html>
